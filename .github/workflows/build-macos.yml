name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - video_first_sentence.py
      - build_macos_dmg.sh
      - .github/workflows/build-macos.yml

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build DMG
        run: bash build_macos_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: video-first-sentence-macos-dmg
          path: 视频首句重命名-macOS.dmg
          if-no-files-found: error
